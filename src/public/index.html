<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Stats API Demo</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2em;
      text-align: center;
      background: #f8fafc;
      color: #222;
    }
    section {
      margin-bottom: 2em;
    }
    h1, h2 {
      font-weight: 700;
      letter-spacing: 1px;
    }
    pre {
      background: #f4f4f4;
      padding: 1em;
      border-radius: 8px;
      font-size: 1em;
      color: #333;
      box-shadow: 0 2px 8px #0001;
      text-align: left;
      max-width: 600px;
      margin: 1em auto;
    }
    .tiles-grid, .chart-tiles-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5em;
      max-width: 900px;
      margin: 0 auto;
    }
    .tile, .chart-tile {
      flex: 1 1 250px;
      max-width: 280px;
      min-width: 200px;
      background: #fff;
      box-shadow: 0 2px 8px #0001;
      border-radius: 12px;
      padding: 1.2em 1.5em;
      margin-bottom: 1em;
      box-sizing: border-box;
      transition: box-shadow 0.2s;
      text-align: left;
    }
    .tile:hover, .chart-tile:hover {
      box-shadow: 0 4px 16px #0002;
    }
    .chart-section-title {
      text-align: left;
      max-width: 900px;
      margin: 0 auto 0.5em auto;
      font-size: 1.2em;
      color: #2d3436;
    }
    .tile-title {
      font-weight: bold;
      font-size: 1.1em;
      margin-bottom: 0.5em;
      color: #0074d9;
      letter-spacing: 0.5px;
    }
    .tile-value {
      display: block;
      margin-left: 0.5em;
      font-size: 1.05em;
      color: #333;
      margin-bottom: 0.2em;
    }
    #tiles-section-selector, #chart-section-selector {
      margin-bottom: 1em;
    }
    select {
      padding: 0.4em 1em;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1em;
      background: #fff;
      margin-bottom: 0.5em;
      cursor: pointer;
    }
    canvas#chartCanvas {
      background: #f4f4f4;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0001;
      margin-bottom: 1em;
    }
  </style>
</head>
<body>
  <h1>Stats API Demo</h1>
  <section>
    <h2>Tiles</h2>
    <div id="tiles-section-selector" style="margin-bottom:1em;"></div>
    <div id="tiles"></div>
  </section>
  <section>
    <h2>Pie</h2>
    <div id="pie"></div>
  </section>
  <section>
    <h2>Chart (type: marketCap)</h2>
    <div id="chart-section-selector" style="margin-bottom:1em;"></div>
    <canvas id="chartCanvas" width="600" height="300" style="background:#f4f4f4;"></canvas>
    <div id="chart"></div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
