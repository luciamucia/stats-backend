<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Admin: Tiles CRUD</title>
  <style>
    body { font-family: sans-serif; margin: 2em; background: #f8fafc; color: #222; }
    h1 { text-align: center; }
    form { background: #fff; box-shadow:0 2px 8px #0001; border-radius:10px; padding:1em; max-width:400px; margin:1em auto; }
    input, button { font-size: 1em; margin-bottom: 0.5em; width: 90%; padding: 0.4em; border-radius: 6px; border: 1px solid #ccc; }
    button { width: auto; cursor: pointer; }
    table { width:100%; max-width:700px; margin:auto; border-collapse:collapse; background:#fff; box-shadow:0 2px 8px #0001; border-radius:10px; }
    th, td { padding: 0.5em 0.7em; border-bottom: 1px solid #eee; }
    th { background: #f4f4f4; }
    tr:last-child td { border-bottom: none; }
    pre { background:none; padding:0; margin:0; font-size:0.95em; }
  </style>
</head>
<body>
  <h1>Admin: Tiles CRUD</h1>
  <form id="tileForm">
    <input type="hidden" id="tileId">
    <div><input id="tileTitle" placeholder="Title" required></div>
    <div><input id="tileValue" placeholder='Value (JSON lub tekst)'></div>
    <div><input id="tileSection" placeholder="Section"></div>
    <div><input id="tileIdx" placeholder="Index" type="number"></div>
    <button type="submit" id="tileSaveBtn">Save</button>
    <button type="button" id="tileCancelBtn" style="display:none;">Cancel</button>
  </form>
  <div id="tilesAdminList"></div>

  <hr style="margin:2em 0;">
  <h1>Admin: Chart CRUD</h1>
  <form id="chartForm">
    <div><input id="chartType" placeholder="Type (np. users)" required></div>
    <div><input id="chartTimestamp" placeholder="Timestamp (YYYY-MM-DD lub ISO)" required></div>
    <div><input id="chartValue" placeholder="Value (liczba)" required type="number" step="any"></div>
    <button type="submit" id="chartSaveBtn">Add</button>
    <button type="button" id="chartCancelBtn" style="display:none;">Cancel</button>
  </form>
  <div id="chartAdminList"></div>
  <script src="admin.js"></script>
</body>
</html>
